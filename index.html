    <!-- Meta Pixel — SPA tracking: PageView on route change, Lead on form success,
         Contact on WhatsApp / phone / email clicks. Kept here (not in React source)
         so tracking is decoupled from the app code. -->
    <script>
      (function () {
        var leadSent = false;

        /* ── 1. PageView on client-side route change ──
           React Router navigates without a page load, so the pixel's initial
           PageView would be the only one ever recorded. Patch the history API.
           Also fires a GA4 page_view, since gtag's auto page_view only covers
           the first hard load. */
        var lastPath = location.pathname + location.search;
        function trackRoute() {
          var current = location.pathname + location.search;
          if (current === lastPath) return;
          lastPath = current;
          leadSent = false;
          if (window.fbq) fbq('track', 'PageView');
          if (window.gtag) {
            gtag('event', 'page_view', {
              page_path: current,
              page_location: location.href,
              page_title: document.title
            });
          }
        }
        ['pushState', 'replaceState'].forEach(function (method) {
          var original = history[method];
          history[method] = function () {
            var result = original.apply(this, arguments);
            setTimeout(trackRoute, 0);
            return result;
          };
        });
        window.addEventListener('popstate', function () { setTimeout(trackRoute, 0); });

        /* ── 2. Lead — fires only on a confirmed successful submission ──
           ContactForm.jsx renders #successMsg only after Web3Forms returns
           success, so watching for that node avoids counting failed sends. */
        function sendLead() {
          if (leadSent) return;
          leadSent = true;
          if (window.fbq) {
            fbq('track', 'Lead', {
              content_name: 'טופס יצירת קשר',
              content_category: 'אתר המשרד'
            });
          }
          if (window.gtag) {
            gtag('event', 'generate_lead', { content_name: 'טופס יצירת קשר' });
          }
        }
        new MutationObserver(function () {
          if (!leadSent && document.getElementById('successMsg')) sendLead();
        }).observe(document.documentElement, { childList: true, subtree: true });

        /* ── 3. Contact — WhatsApp / phone / email clicks ── */
        document.addEventListener('click', function (e) {
          var link = e.target && e.target.closest && e.target.closest('a[href]');
          if (!link) return;
          var href = link.getAttribute('href') || '';
          var channel = null;
          if (/^https?:\/\/(wa\.me|api\.whatsapp\.com)/i.test(href)) {
            channel = 'WhatsApp';
          } else if (/^tel:/i.test(href)) {
            channel = 'Phone';
          } else if (/^mailto:/i.test(href)) {
            channel = 'Email';
          }
          if (!channel) return;
          if (window.fbq) fbq('track', 'Contact', { content_name: channel });
          if (window.gtag) gtag('event', 'contact', { method: channel });
        }, true);
      })();
    </script>
